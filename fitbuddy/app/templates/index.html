<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitBuddy - AI Workout Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: 'Roboto', sans-serif;
    background: linear-gradient(rgba(10,12,16,.55), rgba(10,12,16,.55)),
                url('/static/images/gym-bg.jpg') center/cover no-repeat;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 440px; background: rgba(20,22,28,.9);
    border: 1px solid rgba(255,255,255,.08); border-radius: 18px;
    padding: 32px; color: #f2f4f8; box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  h1 { text-align: center; font-size: 22px; margin: 0 0 24px; font-weight: 900; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; color: #b7bfcc; font-weight: 500; }
  input, select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05); color: #fff; font-size: 14px;
  }
  button {
    margin-top: 22px; width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: #3b82f6; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:hover { opacity: .9; }
  @media (max-width: 480px) { .card { padding: 22px; } }
</style>
</head>
<body>
  <div class="card">
    <h1>💪 FitBuddy - AI Workout Generator</h1>
    <form action="/generate-workout" method="post">
      <label>Name</label>
      <input type="text" name="username" required>

      <label>User ID</label>
      <input type="number" name="user_id" required>

      <label>Age</label>
      <input type="number" name="age" required>

      <label>Weight (kg)</label>
      <input type="number" step="0.1" name="weight" required>

      <label>Fitness Goal</label>
      <input type="text" name="goal" placeholder="e.g., weight loss, flexibility" required>

      <label>Workout Intensity</label>
      <select name="intensity">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>
  </div>
</body>
</html>
